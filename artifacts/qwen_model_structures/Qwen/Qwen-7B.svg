<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1650" viewBox="0 0 1480 1650" role="img" aria-labelledby="title desc">
  <title id="title">Qwen-7B architecture</title>
  <desc id="desc">Vertical Qwen-7B decoder-only Transformer diagram: token embedding, 32 pre-norm decoder blocks with masked multi-head self-attention and SwiGLU feed-forward layers, then final RMSNorm and language-model output.</desc>
  <defs>
    <style>
      .title{font:800 64px Arial,sans-serif;fill:#d31578}.major{font:700 25px Arial,sans-serif;fill:#111}.label{font:500 23px Arial,sans-serif;fill:#111}.small{font:500 18px Arial,sans-serif;fill:#111}.note{font:700 27px Arial,sans-serif;fill:#111}.accent{fill:#d31578}.outer{fill:#d6d6d6;stroke:#111;stroke-width:4}.block{fill:#d7abc4;stroke:#111;stroke-width:4}.module{fill:#fff;stroke:#111;stroke-width:4}.attn{fill:#575757;stroke:#111;stroke-width:4}.attntext{font:500 22px Arial,sans-serif;fill:#fff}.line{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.res{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#111;stroke-width:3.5;stroke-dasharray:8 8;fill:none}.sum{fill:#fff;stroke:#111;stroke-width:4}.brace{font:88px Georgia,serif;fill:#111}.mono{font:500 23px monospace;fill:#111}
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0 0 L10 5.5 L0 11z" fill="#111"/></marker>
  </defs>
  <rect width="1480" height="1650" fill="#fff"/>
  <text x="740" y="75" text-anchor="middle" class="title">Qwen-7B</text>
  <text x="740" y="106" text-anchor="middle" class="small">QWenLMHeadModel · decoder-only causal Transformer</text>

  <rect class="outer" x="242" y="180" width="628" height="1255" rx="68"/>
  <rect class="module" x="444" y="1260" width="224" height="54" rx="13"/>
  <text x="556" y="1295" text-anchor="middle" class="label">Token embedding</text>
  <path class="line" d="M556 1436 V1317"/>
  <path class="line" d="M556 1260 V1184"/>

  <rect class="block" x="344" y="366" width="430" height="777" rx="58"/>
  <text x="372" y="402" class="major">Qwen decoder block</text>
  <text x="744" y="402" text-anchor="end" class="small">hidden state: 4,096</text>

  <rect class="module" x="474" y="1031" width="164" height="54" rx="13"/>
  <text x="556" y="1066" text-anchor="middle" class="label">RMSNorm 1</text>
  <path class="line" d="M556 1143 V1088"/>
  <path class="line" d="M556 1031 V970"/>
  <rect class="attn" x="405" y="846" width="302" height="124" rx="16"/>
  <text x="556" y="892" text-anchor="middle" class="attntext">Masked multi-head</text>
  <text x="556" y="920" text-anchor="middle" class="attntext">self-attention</text>
  <text x="556" y="948" text-anchor="middle" class="attntext">32 heads × 128 dims</text>
  <path class="line" d="M556 1031 V973"/>

  <rect class="module" x="198" y="880" width="166" height="54" rx="13"/>
  <text x="281" y="915" text-anchor="middle" class="label">RoPE</text>
  <path class="line" d="M364 907 H401"/>
  <circle class="sum" cx="556" cy="792" r="20"/>
  <text x="556" y="801" text-anchor="middle" class="major">+</text>
  <path class="line" d="M556 846 V815"/>
  <path class="res" d="M474 1058 H408 V792 H533"/>

  <rect class="module" x="474" y="687" width="164" height="54" rx="13"/>
  <text x="556" y="722" text-anchor="middle" class="label">RMSNorm 2</text>
  <path class="line" d="M556 772 V744"/>
  <path class="line" d="M556 687 V627"/>
  <rect class="module" x="440" y="564" width="232" height="63" rx="13" fill="#eee"/>
  <text x="556" y="604" text-anchor="middle" class="label">Feed-forward (SwiGLU)</text>
  <circle class="sum" cx="556" cy="515" r="20"/>
  <text x="556" y="524" text-anchor="middle" class="major">+</text>
  <path class="line" d="M556 564 V538"/>
  <path class="res" d="M474 714 H408 V515 H533"/>
  <path class="line" d="M556 495 V440"/>

  <rect class="module" x="454" y="286" width="204" height="54" rx="13"/>
  <text x="556" y="321" text-anchor="middle" class="label">Final RMSNorm</text>
  <path class="line" d="M556 366 V343"/>
  <path class="line" d="M556 286 V226"/>
  <rect class="module" x="431" y="207" width="250" height="54" rx="13"/>
  <text x="556" y="242" text-anchor="middle" class="label">Linear output layer</text>
  <path class="line" d="M556 207 V132"/>

  <text x="292" y="1152" class="brace">}</text>
  <text x="306" y="1168" class="note"><tspan class="accent">32</tspan> ×</text>
  <rect class="module" x="443" y="1472" width="226" height="54" rx="13"/>
  <text x="556" y="1507" text-anchor="middle" class="label">Tokenized text</text>
  <path class="line" d="M556 1472 V1438"/>
  <path class="line" d="M556 1590 V1528"/>
  <text x="556" y="1630" text-anchor="middle" class="mono">Sample input text</text>

  <path class="dash" d="M685 234 L764 154"/>
  <text x="787" y="146" class="note">Vocabulary size of <tspan class="accent">151,936</tspan></text>
  <path class="dash" d="M672 590 L1020 511"/>
  <text x="1015" y="495" class="note">Feed-forward expansion</text>
  <text x="1015" y="528" class="note"><tspan class="accent">4,096 → 11,008</tspan> × 2</text>
  <path class="dash" d="M708 910 L947 830"/>
  <text x="968" y="824" class="note"><tspan class="accent">32</tspan> attention heads</text>
  <text x="968" y="856" class="note">head dimension of <tspan class="accent">128</tspan></text>
  <path class="dash" d="M281 936 L196 1104"/>
  <text x="55" y="1126" class="note">RoPE θ = <tspan class="accent">10,000</tspan></text>
  <text x="55" y="1158" class="note">Dynamic NTK + LogN</text>
  <path class="dash" d="M442 1286 L907 1344"/>
  <text x="927" y="1334" class="note">Embedding dimension of <tspan class="accent">4,096</tspan></text>
  <text x="927" y="1370" class="note">Supported context length:</text>
  <text x="927" y="1404" class="note"><tspan class="accent">32,768</tspan> tokens</text>

  <rect class="outer" x="988" y="221" width="410" height="330" rx="30"/>
  <text x="1018" y="257" class="major">SwiGLU feed-forward detail</text>
  <rect class="module" x="1074" y="439" width="170" height="50" rx="13"/>
  <text x="1159" y="472" text-anchor="middle" class="label">c_proj</text>
  <text x="1261" y="472" class="small">11,008 → 4,096</text>
  <circle class="sum" cx="1159" cy="413" r="17"/><text x="1159" y="421" text-anchor="middle" class="major">×</text>
  <path class="line" d="M1159 439 V432"/>
  <rect class="module" x="1018" y="344" width="164" height="50" rx="13"/>
  <text x="1100" y="376" text-anchor="middle" class="label">SiLU</text>
  <rect class="module" x="1212" y="344" width="156" height="50" rx="13"/>
  <text x="1290" y="376" text-anchor="middle" class="label">w1 gate</text>
  <path class="line" d="M1100 344 V303 H1159 V394"/>
  <path class="line" d="M1290 394 V413 H1178"/>
  <rect class="module" x="1074" y="270" width="170" height="50" rx="13"/>
  <text x="1159" y="302" text-anchor="middle" class="label">w2 up</text>
  <text x="1261" y="302" class="small">4,096 → 11,008</text>
  <path class="dash" d="M1100 394 L1065 532"/>

  <text x="1060" y="1584" class="small">Source: Qwen/Qwen-7B config.json + modeling_qwen.py</text>
</svg>
