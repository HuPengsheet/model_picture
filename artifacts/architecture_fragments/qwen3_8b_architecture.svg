<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1720" viewBox="0 0 1500 1720" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3-8B architecture</title>
  <desc id="desc">Architecture diagram for Qwen3-8B: a 36-layer decoder-only Transformer with RMSNorm, causal grouped-query attention using RoPE, and SwiGLU feed-forward layers.</desc>
  <style>
    .outer{fill:#d4d4d4;stroke:#111;stroke-width:4}.block{fill:#81a9e2;stroke:#111;stroke-width:4}.module{fill:#fff;stroke:#111;stroke-width:4}.attention{fill:#545454;stroke:#111;stroke-width:4}.sum{fill:#fff;stroke:#111;stroke-width:4}.multiply{fill:#fff;stroke:#111;stroke-width:4}.panel{fill:#d4d4d4;stroke:#111;stroke-width:5;stroke-dasharray:8 8}.flow{fill:none;stroke:#111;stroke-width:3.2;stroke-linejoin:round;marker-end:url(#thin-arrow)}.residual{fill:none;stroke:#111;stroke-width:3.2;stroke-linejoin:round;marker-end:url(#thin-arrow)}.merge{fill:none;stroke:#111;stroke-width:3.2;stroke-linejoin:round}.callout{fill:none;stroke:#111;stroke-width:3;stroke-dasharray:6 6}.title{font:800 62px Arial,sans-serif;fill:#d31578}.subtitle{font:500 22px Arial,sans-serif;fill:#334e68}.heading{font:700 30px Arial,sans-serif;fill:#111}.label{font:500 24px Arial,sans-serif;fill:#111}.small{font:500 20px Arial,sans-serif;fill:#111}.attnlabel{font:500 25px Arial,sans-serif;fill:#fff}.attnsmall{font:500 23px Arial,sans-serif;fill:#fff}.note{font:700 27px Arial,sans-serif;fill:#111}.embeddingnote{font:700 32px Arial,sans-serif;fill:#111}.blue{fill:#2998ff;font-weight:700}.repeat{font:700 30px Arial,sans-serif;fill:#2998ff}
  </style>
  <defs>
    <marker id="thin-arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="#111"/></marker>
  </defs>
  <rect width="1500" height="1720" fill="#fff"/>
  <text x="430" y="73" text-anchor="middle" class="title">Qwen3-8B</text>
  <text x="430" y="115" text-anchor="middle" class="subtitle">Qwen3ForCausalLM · decoder-only causal Transformer</text>

  <!-- Main model body -->
  <rect class="outer" x="120" y="150" width="620" height="1350" rx="66"/>
  <rect class="module" x="300" y="210" width="260" height="55" rx="13"/>
  <text x="430" y="246" text-anchor="middle" class="label">LM Head</text>
  <rect class="module" x="320" y="300" width="220" height="55" rx="13"/>
  <text x="430" y="336" text-anchor="middle" class="label">Final RMSNorm</text>

  <!-- Repeated decoder layer × 36 -->
  <rect class="block" x="210" y="400" width="440" height="800" rx="56"/>
  <text x="645" y="475" text-anchor="end" class="small">hidden size 4,096</text>
  <circle class="sum" cx="430" cy="530" r="20"/>
  <text x="430" y="540" text-anchor="middle" class="heading">+</text>
  <rect class="module" x="320" y="580" width="220" height="55" rx="13"/>
  <text x="430" y="616" text-anchor="middle" class="label">SwiGLU FFN</text>
  <rect class="module" x="324" y="690" width="212" height="55" rx="13"/>
  <text x="430" y="726" text-anchor="middle" class="label">RMSNorm 2</text>
  <circle class="sum" cx="430" cy="800" r="20"/>
  <text x="430" y="810" text-anchor="middle" class="heading">+</text>
  <rect class="attention" x="265" y="850" width="330" height="125" rx="16"/>
  <text x="430" y="891" text-anchor="middle" class="attnlabel">Causal GQA Attention</text>
  <text x="430" y="921" text-anchor="middle" class="attnsmall">32 Q heads · 8 KV heads</text>
  <text x="430" y="952" text-anchor="middle" class="attnlabel">head dim 128</text>
  <rect class="module" x="324" y="1040" width="212" height="55" rx="13"/>
  <text x="430" y="1076" text-anchor="middle" class="label">RMSNorm 1</text>
  <text x="238" y="1180" class="repeat">36 ×</text>

  <!-- Input, RoPE and output -->
  <rect class="module" x="20" y="933" width="150" height="55" rx="13"/>
  <text x="88" y="969" text-anchor="middle" class="label">RoPE</text>
  <rect class="module" x="250" y="1280" width="360" height="55" rx="13"/>
  <text x="430" y="1316" text-anchor="middle" class="label">Token embedding layer</text>
  <path class="callout" d="M612 1308 L810 1360"/>
  <text x="840" y="1350" class="embeddingnote">Embedding</text>
  <text x="840" y="1392" class="embeddingnote">dimension of <tspan class="blue">4,096</tspan></text>
  <rect class="module" x="280" y="1540" width="300" height="55" rx="13"/>
  <text x="430" y="1576" text-anchor="middle" class="label">Tokenized text</text>
  <path class="flow" d="M430 1540 V1338"/>
  <path class="flow" d="M430 1280 V1098"/>
  <path class="flow" d="M430 1040 V978"/>
  <path class="flow" d="M430 850 V823"/>
  <path class="flow" d="M430 778 V748"/>
  <path class="flow" d="M430 690 V638"/>
  <path class="flow" d="M430 580 V553"/>
  <path class="flow" d="M430 508 V358"/>
  <path class="flow" d="M430 300 V268"/>
  <path class="flow" d="M430 210 V130"/>
  <path class="flow" d="M170 960 H262"/>
  <path class="residual" d="M430 1150 H610 V800 H453"/>
  <path class="residual" d="M430 778 H610 V530 H453"/>

  <!-- SwiGLU detail. Dimensions come from Qwen3-8B config.json. -->
  <rect class="panel" x="805" y="440" width="630" height="620" rx="34"/>
  <text x="1110" y="495" text-anchor="middle" class="heading">SwiGLU FFN</text>
  <rect class="module" x="970" y="525" width="280" height="55" rx="16"/>
  <text x="1110" y="561" text-anchor="middle" class="label">down_proj</text>
  <text x="1260" y="561" class="small">12,288 → 4,096</text>
  <circle class="multiply" cx="1110" cy="640" r="20"/>
  <text x="1110" y="650" text-anchor="middle" class="heading">×</text>
  <rect class="module" x="860" y="705" width="220" height="55" rx="16"/>
  <text x="970" y="741" text-anchor="middle" class="label">SiLU</text>
  <rect class="module" x="1140" y="705" width="220" height="55" rx="16"/>
  <text x="1250" y="741" text-anchor="middle" class="label">up_proj</text>
  <rect class="module" x="860" y="805" width="220" height="55" rx="16"/>
  <text x="970" y="841" text-anchor="middle" class="label">gate_proj</text>
  <rect class="module" x="940" y="925" width="340" height="55" rx="16"/>
  <text x="1110" y="961" text-anchor="middle" class="label">hidden states (4,096)</text>
  <text x="1110" y="1045" text-anchor="middle" class="small">gate / up: 4,096 → 12,288</text>
  <path class="flow" d="M1110 925 V900 H970 V862"/>
  <path class="flow" d="M1110 900 H1250 V762"/>
  <path class="flow" d="M970 805 V762"/>
  <path class="merge" d="M970 705 V640 H1088"/>
  <path class="merge" d="M1250 705 V640 H1132"/>
  <path class="flow" d="M1110 618 V583"/>
  <path class="flow" d="M542 608 L802 650"/>
  <text x="840" y="1100" class="small">Source: Qwen/Qwen3-8B config.json</text>
</svg>
