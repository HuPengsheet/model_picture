<svg xmlns="http://www.w3.org/2000/svg" width="660" height="530" viewBox="0 0 660 530" role="img" aria-label="SwiGLU feed-forward detail layout">
  <style>
    .panel{fill:#d4d4d4;stroke:#111;stroke-width:5;stroke-dasharray:8 8}.module{fill:#fff;stroke:#111;stroke-width:4}.multiply{fill:#fff;stroke:#111;stroke-width:4}.flow{fill:none;stroke:#111;stroke-width:3.2;stroke-linejoin:round;marker-end:url(#thin-arrow)}.merge{fill:none;stroke:#111;stroke-width:3.2;stroke-linejoin:round}.label{font:500 22px Arial,sans-serif;fill:#111}.times{font:500 30px Arial,sans-serif;fill:#111}.caption{font:700 28px Arial,sans-serif;fill:#111}
  </style>
  <defs>
    <marker id="thin-arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7z" fill="#111"/>
    </marker>
  </defs>
  <rect width="660" height="530" fill="#fff"/>
  <rect class="panel" x="25" y="20" width="610" height="425" rx="34"/>

  <!-- All white frames are 55px high. -->
  <rect class="module" x="75" y="60" width="220" height="55" rx="16"/>
  <rect class="module" x="75" y="205" width="220" height="55" rx="16"/>
  <rect class="module" x="375" y="205" width="220" height="55" rx="16"/>
  <rect class="module" x="75" y="350" width="220" height="55" rx="16"/>
  <circle class="multiply" cx="330" cy="175" r="20"/>
  <text x="185" y="96" text-anchor="middle" class="label">Linear layer</text>
  <text x="185" y="241" text-anchor="middle" class="label">SiLU activation</text>
  <text x="485" y="241" text-anchor="middle" class="label">Linear layer</text>
  <text x="185" y="386" text-anchor="middle" class="label">Linear layer</text>
  <text x="330" y="186" text-anchor="middle" class="times">×</text>

  <!-- Bottom-up main branch and two gated branches. -->
  <path class="flow" d="M185 350 V263"/>
  <path class="merge" d="M185 205 V175 H308"/>
  <path class="merge" d="M485 205 V175 H352"/>
  <path class="flow" d="M308 175 H185 V118"/>
  <text x="330" y="495" text-anchor="middle" class="caption">SwiGLU FFN</text>
</svg>
