<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Multi-head Latent Attention</title>
  <desc id="desc">Reusable MLA component with low-rank query and key-value compression, decoupled RoPE, causal attention and output projection.</desc>
  <style>.panel{fill:#fff;stroke:#111;stroke-width:4;stroke-dasharray:7 8}.module{fill:#fff;stroke:#111;stroke-width:3}.latent{fill:#edf4ff;stroke:#111;stroke-width:3}.attention{fill:#fffbdc;stroke:#111;stroke-width:3}.output{fill:#d5d5d5;stroke:#111;stroke-width:3}.flow{fill:none;stroke:#111;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}.title{font:700 30px Arial,sans-serif;fill:#111}.label{font:500 21px Arial,sans-serif;fill:#111}.small{font:500 18px Arial,sans-serif;fill:#555}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#111"/></marker></defs>
  <rect width="1200" height="620" fill="#fff"/><rect class="panel" x="20" y="20" width="1160" height="580" rx="36"/>
  <text x="600" y="62" text-anchor="middle" class="title">Multi-head Latent Attention</text>
  <rect class="output" x="470" y="82" width="260" height="52" rx="15"/><text x="600" y="116" text-anchor="middle" class="label">Output projection</text>
  <rect class="attention" x="340" y="175" width="520" height="58" rx="16"/><text x="600" y="212" text-anchor="middle" class="label">Causal multi-head attention</text><path class="flow" d="M600 175 V135"/>
  <rect class="module" x="70" y="285" width="330" height="52" rx="15"/><text x="235" y="319" text-anchor="middle" class="label">Q expansion → Q heads</text>
  <rect class="module" x="435" y="285" width="330" height="52" rx="15"/><text x="600" y="319" text-anchor="middle" class="label">KV expansion → K(noPE), V</text>
  <rect class="latent" x="800" y="285" width="330" height="52" rx="15"/><text x="965" y="319" text-anchor="middle" class="label">Decoupled RoPE</text>
  <path class="flow" d="M235 285 V255 H470 V233"/><path class="flow" d="M600 285 V233"/><path class="flow" d="M965 285 V255 H730 V233"/>
  <rect class="latent" x="70" y="390" width="330" height="52" rx="15"/><text x="235" y="424" text-anchor="middle" class="label">Q low-rank compression</text>
  <rect class="latent" x="435" y="390" width="330" height="52" rx="15"/><text x="600" y="424" text-anchor="middle" class="label">KV latent compression</text>
  <path class="flow" d="M235 390 V338"/><path class="flow" d="M600 390 V338"/>
  <path class="flow" d="M600 535 H235 V443"/><path class="flow" d="M600 535 V443"/>
  <text x="600" y="520" text-anchor="middle" class="label">Input hidden states</text>
  <text x="600" y="575" text-anchor="middle" class="small">Fill Q rank, KV rank, head dimensions and RoPE dimensions from config</text>
</svg>
