<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1400" viewBox="0 0 1300 1400" style="font-family:Arial, Helvetica, sans-serif">
<title>Sliding Window Attention — causal, generic window size w</title>
<desc>Generic causal sliding-window attention diagram. Window size w and sequence length n are symbolic parameters.</desc>
<circle data-anchor="origin" cx="0" cy="0" r="0" opacity="0"/>
<circle data-anchor="input" cx="650" cy="1400" r="0" opacity="0"/>
<circle data-anchor="output" cx="650" cy="0" r="0" opacity="0"/>
<defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#222"/></marker>
<style>.line{fill:none;stroke:#222;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.box{stroke:#181818;stroke-width:2.8}.text{font-family:Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle;font-weight:400}.math{font-family:Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle;font-style:italic}</style></defs>
<rect width="1300" height="1400" fill="none"/>
<rect x="12" y="12" width="1276" height="1376" rx="34" fill="#edf5ff" stroke="#222" stroke-width="3" stroke-dasharray="9 8"/>

<!-- ===== Title ===== -->
<text data-slot="title" class="text" x="650" y="68" font-size="50">Sliding Window Attention</text>
<text data-slot="window_label" class="text" x="650" y="116" font-size="27">Causal · window size = w</text>

<!-- ===== Query-Key Illustration ===== -->
<text class="text" x="650" y="176" font-size="28">Current query</text>

<!-- q_t box -->
<rect class="box" x="700" y="192" width="92" height="80" rx="20" fill="#ff9892"/>
<text class="math" x="746" y="244" font-size="42">q<tspan baseline-shift="sub" font-size="70%">t</tspan></text>

<!-- yellow window background behind window keys -->
<rect x="310" y="336" width="510" height="112" rx="24" fill="#ffffd5"/>

<!-- arrows from window keys to q_t -->
<path class="line" d="M410 356 L716 276" marker-end="url(#arrow)"/>
<path class="line" d="M540 356 L730 276" marker-end="url(#arrow)"/>
<path class="line" d="M660 356 L746 276" marker-end="url(#arrow)"/>
<path class="line" d="M780 356 L762 276" marker-end="url(#arrow)"/>

<!-- key boxes row -->
<!-- k_1 (gray, outside window) -->
<rect class="box" x="92" y="360" width="76" height="76" rx="18" fill="#d5d5d5"/>
<text class="math" x="130" y="408" font-size="34">k<tspan baseline-shift="sub" font-size="70%">1</tspan></text>

<!-- dots (outside window) -->
<text class="math" x="234" y="408" font-size="38">&#x22EF;</text>

<!-- k_{t-w+1} (yellow, window start) -->
<rect class="box" x="302" y="360" width="108" height="76" rx="18" fill="#ffdf80"/>
<text class="math" x="356" y="402" font-size="28">k<tspan baseline-shift="sub" font-size="62%">t&#x2212;w+1</tspan></text>

<!-- dots (in window) -->
<text class="math" x="478" y="408" font-size="38" fill="#b08800">&#x22EF;</text>

<!-- k_{t-1} (yellow) -->
<rect class="box" x="544" y="360" width="96" height="76" rx="18" fill="#ffdf80"/>
<text class="math" x="592" y="406" font-size="32">k<tspan baseline-shift="sub" font-size="66%">t&#x2212;1</tspan></text>

<!-- k_t (yellow, window end) -->
<rect class="box" x="700" y="360" width="76" height="76" rx="18" fill="#ffdf80"/>
<text class="math" x="738" y="408" font-size="34">k<tspan baseline-shift="sub" font-size="70%">t</tspan></text>

<!-- k_{t+1} (gray, future) -->
<rect class="box" x="838" y="360" width="96" height="76" rx="18" fill="#d5d5d5"/>
<text class="math" x="886" y="406" font-size="32">k<tspan baseline-shift="sub" font-size="66%">t+1</tspan></text>

<!-- dots (future) -->
<text class="math" x="1004" y="408" font-size="38">&#x22EF;</text>

<!-- k_n (gray, future) -->
<rect class="box" x="1080" y="360" width="76" height="76" rx="18" fill="#d5d5d5"/>
<text class="math" x="1118" y="408" font-size="34">k<tspan baseline-shift="sub" font-size="70%">n</tspan></text>

<text class="text" x="60" y="408" font-size="24">Keys</text>

<!-- window bracket -->
<path class="line" d="M303 460 V474 H775 V460"/>
<text class="text" x="540" y="510" font-size="30" font-style="italic">w</text>
<text class="text" x="540" y="542" font-size="22">tokens in window</text>

<text class="text" x="166" y="476" font-size="22" style="fill:#666">Outside window</text>
<text class="text" x="1010" y="476" font-size="22" style="fill:#666">Future (masked)</text>

<!-- ===== Attention Mask Schematic ===== -->
<text class="text" x="650" y="610" font-size="38">Attention Mask</text>
<text class="text" x="650" y="648" font-size="26">n &#x00D7; n causal sliding-window pattern</text>

<!-- axis labels -->
<text class="text" x="650" y="686" font-size="26">Keys / values &#x2192;</text>
<text class="text" transform="translate(348 950) rotate(-90)" font-size="26">Queries &#x2192;</text>

<!-- column labels -->
<text class="math" x="410" y="716" font-size="23">1</text>
<text class="math" x="570" y="716" font-size="21">t&#x2212;w+1</text>
<text class="math" x="712" y="716" font-size="23">t</text>
<text class="math" x="890" y="716" font-size="23">n</text>

<!-- row labels -->
<text class="math" x="370" y="752" font-size="23">1</text>
<text class="math" x="370" y="912" font-size="23">w</text>
<text class="math" x="370" y="1042" font-size="23">t</text>
<text class="math" x="370" y="1210" font-size="23">n</text>

<!-- matrix outline: 520×520 square -->
<rect x="390" y="730" width="520" height="520" fill="#f0f0f0" stroke="#222" stroke-width="2.6" rx="3"/>

<!-- band polygon: causal sliding-window region (visual w/n≈0.35, t/n≈0.60) -->
<!-- w_px=182, t_px=312 -->
<!-- P1=(390,730) P2=(910,1250) P3=(728,1250) P4=(390,912) -->
<polygon points="390,730 910,1250 728,1250 390,912" fill="#ffdf80" opacity="0.85"/>

<!-- row t highlight strip: y_center=730+312=1042, strip 32px tall -->
<!-- attended x: from 390+130=520 to 390+312=702, width=182 -->
<rect x="520" y="1026" width="182" height="32" fill="#ff9892" opacity="0.90"/>

<!-- dashed guide lines at col t, col t-w+1, row t -->
<line x1="702" y1="730" x2="702" y2="1250" stroke="#222" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.4"/>
<line x1="520" y1="730" x2="520" y2="1250" stroke="#222" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.4"/>
<line x1="390" y1="1042" x2="910" y2="1042" stroke="#222" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.4"/>

<!-- w bracket on left side: y=730 to y=912 -->
<path d="M380 730 h-14 v182 h14" class="line" style="stroke-width:2;marker-end:none"/>
<text class="math" x="346" y="828" font-size="26">w</text>

<!-- causal diagonal label -->
<text class="math" transform="translate(838 1198) rotate(-45)" font-size="20" fill="#888">causal boundary</text>

<!-- row t annotation -->
<path class="line" d="M708 1042 H930" marker-end="url(#arrow)"/>
<text class="math" x="1010" y="1035" font-size="30">q<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
<text class="text" x="1010" y="1066" font-size="20">attends w keys</text>

<!-- ===== Legend ===== -->
<rect x="270" y="1290" width="28" height="28" rx="6" fill="#ffdf80"/>
<text class="text" x="312" y="1314" font-size="24" style="text-anchor:start">Attended (in window)</text>
<rect x="560" y="1290" width="28" height="28" rx="6" fill="#ff9892"/>
<text class="text" x="602" y="1314" font-size="24" style="text-anchor:start">Current query t</text>
<rect x="830" y="1290" width="28" height="28" rx="6" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
<text class="text" x="872" y="1314" font-size="24" style="text-anchor:start">Masked</text>

<!-- formula -->
<text data-slot="visibility_formula" class="math" x="650" y="1368" font-size="28">Visibility: max(1, i &#x2212; w + 1) &#x2264; j &#x2264; i</text>
</svg>
