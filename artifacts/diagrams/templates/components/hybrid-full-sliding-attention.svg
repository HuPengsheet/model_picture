<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <title>Hybrid full and sliding-window attention</title>
  <desc>Hybrid attention component with full-attention and sliding-window-attention layer scheduling.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#222"/></marker>
    <style>
      .frame{fill:#f7fbff;stroke:#1a1a1a;stroke-width:3;stroke-dasharray:9 8}
      .box{stroke:#222;stroke-width:2.5}.flow{fill:none;stroke:#222;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}
      .wire{fill:none;stroke:#222;stroke-width:2.5;stroke-linejoin:round}.title{font:700 29px Arial,sans-serif;fill:#111;text-anchor:middle}
      .label{font:500 22px Arial,sans-serif;fill:#111;text-anchor:middle}.compact{font:500 18px Arial,sans-serif;fill:#111;text-anchor:middle}.small{font:500 18px Arial,sans-serif;fill:#333;text-anchor:middle}
    </style>
  </defs>
  <rect class="frame" x="3" y="3" width="894" height="714" rx="34"/>
  <text class="title" x="450" y="52">Hybrid Attention</text>
  <text class="small" x="450" y="84">70-layer schedule: Full Attention + Sliding-Window Attention</text>
  <rect class="box" x="286" y="112" width="328" height="62" rx="16" fill="#dbeafe"/>
  <text class="label" x="450" y="151">Output projection</text>
  <rect class="box" x="184" y="224" width="240" height="142" rx="22" fill="#fff3d6"/>
  <text class="label" x="304" y="270">Full Attention</text>
  <text class="small" x="304" y="304">10 layers</text>
  <text class="small" x="304" y="332">L1, 8, 16, …, 70</text>
  <rect class="box" x="476" y="224" width="240" height="142" rx="22" fill="#d7ebff"/>
  <text class="compact" x="596" y="280">Sliding-Window Attention</text>
  <text class="small" x="596" y="332">60 layers · window = 128</text>
  <path class="flow" d="M304 224 V192 H450 V174"/>
  <path class="flow" d="M596 224 V192 H450"/>
  <rect class="box" x="246" y="426" width="408" height="68" rx="16" fill="#fff"/>
  <text class="label" x="450" y="452">GQA: 128 query heads · 8 KV heads</text>
  <text class="small" x="450" y="480">Q/K head dim 192 · V head dim 128</text>
  <path class="flow" d="M450 426 V386 H304 V366"/>
  <path class="flow" d="M450 386 H596 V366"/>
  <rect class="box" x="286" y="552" width="328" height="62" rx="16" fill="#f6e7ff"/>
  <text class="label" x="450" y="579">RoPE · partial factor 33.4%</text>
  <text class="small" x="450" y="604">Input hidden states</text>
  <path class="flow" d="M450 552 V514"/>
  <path class="flow" d="M450 682 V616"/>
</svg>
