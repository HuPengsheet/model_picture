<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" style="font-family:Arial, Helvetica, sans-serif">
  <!-- Local-coordinate contract: input is X; output is the projection exit. -->
  <circle data-anchor="origin" cx="0" cy="0" r="0" opacity="0"/>
  <circle data-anchor="input" cx="450" cy="760" r="0" opacity="0"/>
  <circle data-anchor="output" cx="450" cy="0" r="0" opacity="0"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .math { font-family: Arial, Helvetica, sans-serif; font-style: italic; fill:#111; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 24px; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
      .box { stroke:#1a1a1a; stroke-width:2.2; }
      .gray { fill:#d8d8d8; }
      .pink { fill:#f7938f; }
      .yellow { fill:#fffed6; }
      .wire { fill:none; stroke:#1a1a1a; stroke-width:2.1; marker-end:url(#arrow); stroke-linecap:round; stroke-linejoin:round; }
      .wire-noarrow { fill:none; stroke:#1a1a1a; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="756" fill="#fafafa" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="9 8"/>

  <!-- title -->
  <text x="450" y="52" text-anchor="middle" class="sans title">Multi-Head Attention</text>

  <!-- output projection -->
  <text x="450" y="94" text-anchor="middle" class="sans label">Output</text>
  <path d="M450 139 L450 111" class="wire"/>
  <rect x="360" y="140" width="180" height="68" rx="18" class="box gray"/>
  <text x="450" y="182" text-anchor="middle" class="sans label">Linear</text>
  <text x="555" y="174" class="math small">W<tspan baseline-shift="super" font-size="13">O</tspan></text>

  <path d="M450 242 L450 209" class="wire"/>

  <!-- concat -->
  <rect x="190" y="243" width="520" height="68" rx="18" class="box pink"/>
  <text x="450" y="285" text-anchor="middle" class="sans label">Concat</text>

  <!-- attention heads stack -->
  <rect x="162" y="343" width="576" height="126" rx="20" class="box yellow"/>
  <rect x="145" y="361" width="576" height="126" rx="20" class="box yellow"/>
  <rect x="128" y="379" width="576" height="126" rx="20" class="box yellow"/>
  <text x="416" y="425" text-anchor="middle" class="sans label">Scaled Dot-Product Attention</text>
  <text x="416" y="466" text-anchor="middle" class="math label">softmax(Q<tspan baseline-shift="sub" font-size="16">i</tspan>K<tspan baseline-shift="sub" font-size="16">i</tspan><tspan baseline-shift="super" font-size="16">T</tspan> / √d<tspan baseline-shift="sub" font-size="16">k</tspan>) V<tspan baseline-shift="sub" font-size="16">i</tspan></text>

  <!-- arrows attention to concat -->
  <path d="M300 379 L300 312" class="wire"/>
  <path d="M450 361 L450 312" class="wire"/>
  <path d="M600 343 L600 312" class="wire"/>

  <!-- heads bracket -->
  <path d="M764 343 h18 v162 h-18" class="wire-noarrow"/>
  <text x="804" y="417" class="math label">h</text>
  <text x="796" y="449" class="sans small">heads</text>

  <!-- Qi Ki Vi labels (offset right so they don't overlap the arrow lines) -->
  <text x="286" y="553" text-anchor="middle" class="math label">Q<tspan baseline-shift="sub" font-size="16">i</tspan></text>
  <text x="486" y="553" text-anchor="middle" class="math label">K<tspan baseline-shift="sub" font-size="16">i</tspan></text>
  <text x="686" y="553" text-anchor="middle" class="math label">V<tspan baseline-shift="sub" font-size="16">i</tspan></text>

  <!-- Linear W^Q -->
  <rect x="166" y="580" width="160" height="76" rx="16" class="box gray"/>
  <text x="246" y="611" text-anchor="middle" class="sans label">Linear</text>
  <text x="246" y="640" text-anchor="middle" class="math small">W<tspan baseline-shift="super" font-size="13">Q</tspan></text>
  <path d="M246 580 L246 506" class="wire"/>

  <!-- Linear W^K -->
  <rect x="366" y="580" width="160" height="76" rx="16" class="box gray"/>
  <text x="446" y="611" text-anchor="middle" class="sans label">Linear</text>
  <text x="446" y="640" text-anchor="middle" class="math small">W<tspan baseline-shift="super" font-size="13">K</tspan></text>
  <path d="M446 580 L446 506" class="wire"/>

  <!-- Linear W^V -->
  <rect x="566" y="580" width="160" height="76" rx="16" class="box gray"/>
  <text x="646" y="611" text-anchor="middle" class="sans label">Linear</text>
  <text x="646" y="640" text-anchor="middle" class="math small">W<tspan baseline-shift="super" font-size="13">V</tspan></text>
  <path d="M646 580 L646 506" class="wire"/>

  <!-- input X and split -->
  <text x="450" y="738" text-anchor="middle" class="sans" style="font-size:34px;">X</text>
  <path d="M450 710 L450 698" class="wire-noarrow"/>
  <path d="M450 698 L246 698 L246 657" class="wire"/>
  <path d="M450 698 L446 698 L446 657" class="wire"/>
  <path d="M450 698 L646 698 L646 657" class="wire"/>

</svg>
