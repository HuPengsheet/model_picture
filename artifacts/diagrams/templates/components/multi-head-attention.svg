<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" style="font-family:Arial, Helvetica, sans-serif">
  <!-- Local-coordinate contract: input is X; output is the projection exit. -->
  <circle data-anchor="origin" cx="0" cy="0" r="0" opacity="0"/>
  <circle data-anchor="input" cx="396" cy="980" r="0" opacity="0"/>
  <circle data-anchor="output" cx="450" cy="0" r="0" opacity="0"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .math { font-family: Arial, Helvetica, sans-serif; font-style: italic; fill:#111; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 24px; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
      .box { stroke:#1a1a1a; stroke-width:2.2; }
      .gray { fill:#d8d8d8; }
      .pink { fill:#f7938f; }
      .yellow { fill:#fffed6; }
      .latent { fill:#f6d7a8; }
      .cache { fill:#f6d9d7; stroke-dasharray:7 5; }
      .wire { fill:none; stroke:#1a1a1a; stroke-width:2.1; marker-end:url(#arrow); stroke-linecap:round; stroke-linejoin:round; }
      .wire-noarrow { fill:none; stroke:#1a1a1a; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
      .dash { fill:none; stroke:#1a1a1a; stroke-width:1.9; stroke-dasharray:7 5; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="976" fill="#fafafa" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="9 8"/>

  <!-- title -->
  <text x="450" y="52" text-anchor="middle" class="sans title">Multi-Head Latent Attention</text>

  <!-- output projection -->
  <text x="450" y="94" text-anchor="middle" class="sans label">Output</text>
  <path d="M450 139 L450 111" class="wire"/>
  <rect x="360" y="140" width="180" height="68" rx="18" class="box gray"/>
  <text x="450" y="182" text-anchor="middle" class="sans label">Linear</text>
  <text x="555" y="174" class="math small">W<tspan baseline-shift="super" font-size="13">O</tspan></text>

  <path d="M450 242 L450 209" class="wire"/>

  <!-- concat -->
  <rect x="190" y="243" width="520" height="68" rx="18" class="box pink"/>
  <text x="450" y="285" text-anchor="middle" class="sans label">Concat</text>

  <!-- attention heads stack -->
  <rect x="162" y="343" width="576" height="126" rx="20" class="box yellow"/>
  <rect x="145" y="361" width="576" height="126" rx="20" class="box yellow"/>
  <rect x="128" y="379" width="576" height="126" rx="20" class="box yellow"/>
  <text x="416" y="425" text-anchor="middle" class="sans label">Scaled Dot-Product Attention</text>
  <text x="416" y="466" text-anchor="middle" class="math label">softmax(Q<tspan baseline-shift="sub" font-size="16">i</tspan>K<tspan baseline-shift="sub" font-size="16">i</tspan><tspan baseline-shift="super" font-size="16">T</tspan> / √d<tspan baseline-shift="sub" font-size="16">k</tspan>) V<tspan baseline-shift="sub" font-size="16">i</tspan></text>

  <!-- arrows attention to concat -->
  <path d="M300 379 L300 312" class="wire"/>
  <path d="M450 361 L450 312" class="wire"/>
  <path d="M600 343 L600 312" class="wire"/>

  <!-- heads bracket -->
  <path d="M764 343 h18 v162 h-18" class="wire-noarrow"/>
  <text x="804" y="417" class="math label">h</text>
  <text x="796" y="449" class="sans small">heads</text>

  <!-- Qi Ki Vi -->
  <text x="276" y="553" text-anchor="middle" class="math label">Q<tspan baseline-shift="sub" font-size="16">i</tspan></text>
  <text x="476" y="553" text-anchor="middle" class="math label">K<tspan baseline-shift="sub" font-size="16">i</tspan></text>
  <text x="676" y="553" text-anchor="middle" class="math label">V<tspan baseline-shift="sub" font-size="16">i</tspan></text>

  <!-- Q up -->
  <rect x="166" y="590" width="160" height="76" rx="16" class="box gray"/>
  <text x="246" y="621" text-anchor="middle" class="sans label">Q Up</text>
  <text x="246" y="650" text-anchor="middle" class="math small">W<tspan baseline-shift="super" font-size="13">UQ</tspan></text>
  <path d="M246 590 L246 506" class="wire"/>

  <!-- K up -->
  <rect x="366" y="590" width="160" height="76" rx="16" class="box gray"/>
  <text x="446" y="621" text-anchor="middle" class="sans label">K Up</text>
  <text x="446" y="650" text-anchor="middle" class="math small">W<tspan baseline-shift="super" font-size="13">UK</tspan></text>
  <path d="M446 590 L446 506" class="wire"/>

  <!-- V up -->
  <rect x="566" y="590" width="160" height="76" rx="16" class="box gray"/>
  <text x="646" y="621" text-anchor="middle" class="sans label">V Up</text>
  <text x="646" y="650" text-anchor="middle" class="math small">W<tspan baseline-shift="super" font-size="13">UV</tspan></text>
  <path d="M646 590 L646 506" class="wire"/>

  <!-- latent KV -->
  <rect x="466" y="703" width="160" height="78" rx="16" class="box latent"/>
  <text x="546" y="734" text-anchor="middle" class="sans label">Latent KV</text>
  <text x="546" y="763" text-anchor="middle" class="math small">c<tspan baseline-shift="super" font-size="13">KV</tspan></text>

  <!-- latent to K/V up, clean elbow branches -->
  <path d="M546 703 L546 686 L446 686 L446 667" class="wire"/>
  <path d="M546 703 L546 686 L646 686 L646 667" class="wire"/>

  <!-- cache -->
  <rect x="690" y="713" width="160" height="62" rx="12" class="box cache"/>
  <text x="770" y="740" text-anchor="middle" class="sans small">KV Cache</text>
  <text x="770" y="762" text-anchor="middle" class="math tiny">cached latent KV</text>
  <path d="M690 744 L627 744" class="dash"/>

  <!-- down projections -->
  <rect x="166" y="822" width="160" height="76" rx="16" class="box gray"/>
  <text x="246" y="853" text-anchor="middle" class="sans label">Q Down</text>
  <text x="246" y="882" text-anchor="middle" class="math small">W<tspan baseline-shift="super" font-size="13">DQ</tspan></text>
  <path d="M246 822 L246 667" class="wire"/>

  <rect x="466" y="822" width="160" height="76" rx="16" class="box gray"/>
  <text x="546" y="853" text-anchor="middle" class="sans label">KV Down</text>
  <text x="546" y="882" text-anchor="middle" class="math small">W<tspan baseline-shift="super" font-size="13">DKV</tspan></text>
  <path d="M546 822 L546 782" class="wire"/>

  <!-- input X and split -->
  <text x="396" y="958" text-anchor="middle" class="sans" style="font-size:34px;">X</text>
  <path d="M396 930 L396 918" class="wire-noarrow"/>
  <path d="M396 918 L246 918 L246 899" class="wire"/>
  <path d="M396 918 L546 918 L546 899" class="wire"/>

</svg>
