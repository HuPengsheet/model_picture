<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" style="font-family:Arial, Helvetica, sans-serif">
  <circle data-anchor="origin" cx="0" cy="0" r="0" opacity="0"/>
  <circle data-anchor="input" cx="450" cy="720" r="0" opacity="0"/>
  <circle data-anchor="output" cx="450" cy="0" r="0" opacity="0"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .math { font-family: Arial, Helvetica, sans-serif; font-style: italic; fill:#111; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 24px; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
      .box { stroke:#1a1a1a; stroke-width:2.2; }
      .gray { fill:#d8d8d8; }
      .pink { fill:#f7938f; }
      .yellow { fill:#fffed6; }
      .latent { fill:#f6d7a8; }
      .wire { fill:none; stroke:#1a1a1a; stroke-width:2.1; marker-end:url(#arrow); stroke-linecap:round; stroke-linejoin:round; }
      .wire-noarrow { fill:none; stroke:#1a1a1a; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="716" fill="#fafafa" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="9 8"/>

  <!-- title -->
  <text x="450" y="46" text-anchor="middle" class="sans title">Gated Attention</text>

  <!-- output linear -->
  <text x="450" y="82" text-anchor="middle" class="sans label">Output</text>
  <path d="M450 126 L450 100" class="wire"/>
  <rect x="370" y="127" width="160" height="64" rx="16" class="box gray"/>
  <text x="450" y="166" text-anchor="middle" class="sans label">Linear</text>

  <!-- multiply gate -->
  <path d="M450 220 L450 192" class="wire"/>
  <circle cx="450" cy="244" r="24" class="box" fill="white"/>
  <text x="450" y="254" text-anchor="middle" class="sans" style="font-size:28px;">×</text>

  <!-- attention to multiply: straight line with visible length -->
  <path d="M450 320 L450 269" class="wire"/>

  <!-- sigmoid gate branch -->
  <path d="M474 244 L720 244 L720 330" class="wire"/>
  <circle cx="720" cy="354" r="24" class="box" fill="white"/>
  <text x="720" y="364" text-anchor="middle" class="math" style="font-size:28px;">σ</text>
  <text x="770" y="346" text-anchor="start" class="sans small">Sigmoid</text>
  <text x="770" y="366" text-anchor="start" class="sans small">Gate</text>
  <path d="M696 354 L621 354" class="wire"/>

  <!-- scaled dot-product attention -->
  <rect x="100" y="320" width="520" height="68" rx="18" class="box yellow"/>
  <text x="360" y="362" text-anchor="middle" class="sans label">Scaled Dot-Product Attention</text>

  <!-- Q K V labels (offset right to avoid overlapping arrow lines) -->
  <text x="200" y="432" text-anchor="middle" class="math label">Q</text>
  <text x="375" y="432" text-anchor="middle" class="math label">K</text>
  <text x="545" y="432" text-anchor="middle" class="math label">V</text>

  <!-- QK Norm label -->
  <text x="62" y="458" text-anchor="middle" class="sans tiny">QKNorm</text>

  <!-- RMSNorm boxes -->
  <rect x="100" y="458" width="130" height="60" rx="14" class="box latent"/>
  <text x="165" y="496" text-anchor="middle" class="sans small">RMSNorm</text>
  <path d="M165 458 L165 389" class="wire"/>

  <rect x="275" y="458" width="130" height="60" rx="14" class="box latent"/>
  <text x="340" y="496" text-anchor="middle" class="sans small">RMSNorm</text>
  <path d="M340 458 L340 389" class="wire"/>

  <!-- V wire -->
  <path d="M510 508 L510 389" class="wire"/>

  <!-- linear projections Q K V Gate -->
  <rect x="100" y="560" width="130" height="64" rx="16" class="box gray"/>
  <text x="165" y="600" text-anchor="middle" class="sans label">Linear</text>
  <path d="M165 560 L165 519" class="wire"/>

  <rect x="275" y="560" width="130" height="64" rx="16" class="box gray"/>
  <text x="340" y="600" text-anchor="middle" class="sans label">Linear</text>
  <path d="M340 560 L340 519" class="wire"/>

  <rect x="445" y="560" width="130" height="64" rx="16" class="box gray"/>
  <text x="510" y="600" text-anchor="middle" class="sans label">Linear</text>
  <path d="M510 560 L510 509" class="wire"/>

  <rect x="655" y="560" width="130" height="64" rx="16" class="box gray"/>
  <text x="720" y="600" text-anchor="middle" class="sans label">Linear</text>
  <path d="M720 560 L720 379" class="wire"/>

  <!-- input X and split -->
  <text x="450" y="700" text-anchor="middle" class="sans" style="font-size:34px;">X</text>
  <path d="M450 672 L450 658" class="wire-noarrow"/>
  <path d="M450 658 L165 658 L165 625" class="wire"/>
  <path d="M450 658 L340 658 L340 625" class="wire"/>
  <path d="M450 658 L510 658 L510 625" class="wire"/>
  <path d="M450 658 L720 658 L720 625" class="wire"/>
</svg>
