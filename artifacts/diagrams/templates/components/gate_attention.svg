<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc" style="font-family:Arial, Helvetica, sans-serif">
  <!-- Local-coordinate contract: invisible anchors used only by the SVG compiler. -->
  <circle data-anchor="origin" cx="0" cy="0" r="0" opacity="0"/>
  <circle data-anchor="input" cx="450" cy="650" r="0" opacity="0"/>
  <circle data-anchor="output" cx="450" cy="0" r="0" opacity="0"/>
  <title id="title">Gated Attention</title>
  <desc id="desc">Gated attention with QK normalization, scaled dot-product attention, a sigmoid gate, element-wise multiplication and a final linear projection.</desc>
  <style>.panel{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:6 7}.module{fill:#d9d9d9;stroke:#111;stroke-width:3}.norm{fill:#fff;stroke:#111;stroke-width:3}.attention{fill:#fffbdc;stroke:#111;stroke-width:3}.flow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.wire{fill:none;stroke:#111;stroke-width:3}.title{font:700 32px Arial,Helvetica,sans-serif;fill:#111}.label{font:500 22px Arial,Helvetica,sans-serif;fill:#111}.small{font:500 20px Arial,Helvetica,sans-serif;fill:#111}.symbol{font:500 30px Arial,Helvetica,sans-serif;fill:#111}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#111"/></marker></defs>
  <!-- Transparent outer canvas: the host SVG controls the page background. -->
  <rect width="900" height="650" fill="none"/>
  <text x="450" y="52" text-anchor="middle" class="title">Gated attention</text>
  <rect class="panel" x="45" y="82" width="810" height="520" rx="55"/>
  <rect class="module" x="365" y="90" width="120" height="58" rx="18"/><text x="425" y="127" text-anchor="middle" class="label">Linear</text>
  <circle cx="425" cy="205" r="25" fill="#fff" stroke="#111" stroke-width="3"/><text x="425" y="215" text-anchor="middle" class="symbol">×</text>
  <path class="flow" d="M425 180 V149"/>
  <rect class="attention" x="105" y="260" width="520" height="62" rx="18"/><text x="365" y="299" text-anchor="middle" class="label">Scaled dot-product attention</text>
  <path class="flow" d="M425 260 V230"/>
  <circle cx="705" cy="300" r="24" fill="#fff" stroke="#111" stroke-width="3"/><text x="705" y="310" text-anchor="middle" class="symbol">σ</text>
  <text x="742" y="291" class="small">Sigmoid</text><text x="742" y="319" class="small">Gate</text>
  <path class="wire" d="M450 205 H705 V276"/><path class="flow" d="M681 300 H625"/>
  <text x="145" y="365" text-anchor="middle" class="label">Q</text><text x="345" y="350" text-anchor="middle" class="label">K</text><text x="540" y="365" text-anchor="middle" class="label">V</text>
  <path class="flow" d="M167 390 V322"/>
  <path class="flow" d="M312 390 V322"/>
  <path class="flow" d="M500 438 V322"/>
  <text x="60" y="375" class="small">QKNorm</text>
  <rect class="norm" x="105" y="390" width="125" height="58" rx="16"/><text x="167" y="427" text-anchor="middle" class="small">RMSNorm</text>
  <rect class="norm" x="250" y="390" width="125" height="58" rx="16"/><text x="312" y="427" text-anchor="middle" class="small">RMSNorm</text>
  <rect class="module" x="105" y="500" width="125" height="58" rx="16"/><text x="167" y="537" text-anchor="middle" class="label">Linear</text>
  <rect class="module" x="250" y="500" width="125" height="58" rx="16"/><text x="312" y="537" text-anchor="middle" class="label">Linear</text>
  <rect class="module" x="438" y="500" width="125" height="58" rx="16"/><text x="500" y="537" text-anchor="middle" class="label">Linear</text>
  <rect class="module" x="642" y="500" width="125" height="58" rx="16"/><text x="704" y="537" text-anchor="middle" class="label">Linear</text>
  <path class="flow" d="M167 500 V448"/><path class="flow" d="M312 500 V448"/><path class="wire" d="M500 500 V438"/><path class="flow" d="M704 500 V324"/>
</svg>
