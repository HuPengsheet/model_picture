<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc" style="font-family:Arial, Helvetica, sans-serif">
  <!-- Local-coordinate contract: invisible anchors used only by the SVG compiler. -->
  <circle data-anchor="origin" cx="0" cy="0" r="0" opacity="0"/>
  <circle data-anchor="input" cx="550" cy="540" r="0" opacity="0"/>
  <circle data-anchor="output" cx="550" cy="0" r="0" opacity="0"/>
  <title id="title">SwiGLU feed-forward network template</title>
  <desc id="desc">A reusable bottom-up SwiGLU diagram: the input branches into gate and up projections, the gate branch passes through SiLU, both branches multiply, then pass through the down projection.</desc>
  <style>
    .panel{fill:#fff;stroke:#111;stroke-width:4;stroke-dasharray:7 8}
    .module{fill:#fff;stroke:#111;stroke-width:3}
    .activation{fill:#edf4ff;stroke:#111;stroke-width:3}
    .output{fill:#fff0d4;stroke:#111;stroke-width:3}
    .multiply{fill:#fff;stroke:#111;stroke-width:3}
    .flow{fill:none;stroke:#111;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}
    .title{font:700 30px Arial,Helvetica,sans-serif;fill:#111}
    .label{font:500 22px Arial,Helvetica,sans-serif;fill:#111}
    .small{font:500 19px Arial,Helvetica,sans-serif;fill:#555}
    .symbol{font:500 28px Arial,Helvetica,sans-serif;fill:#111}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9z" fill="#111"/>
    </marker>
  </defs>
  <!-- Transparent outer canvas: the host SVG controls the page background. -->
  <rect width="1100" height="540" fill="none"/>
  <rect class="panel" x="25" y="25" width="1050" height="490" rx="38"/>
  <text x="550" y="68" text-anchor="middle" class="title">SwiGLU FFN</text>

  <rect class="output" x="415" y="92" width="270" height="58" rx="16"/>
  <text x="550" y="129" text-anchor="middle" class="label">Down projection → d_model</text>
  <circle class="multiply" cx="550" cy="205" r="22"/>
  <text x="550" y="215" text-anchor="middle" class="symbol">×</text>
  <path class="flow" d="M550 183 V151"/>

  <rect class="activation" x="205" y="235" width="170" height="58" rx="16"/>
  <text x="290" y="272" text-anchor="middle" class="label">SiLU</text>
  <path class="flow" d="M290 235 V205 H527"/>

  <rect class="module" x="125" y="330" width="330" height="58" rx="16"/>
  <text x="290" y="367" text-anchor="middle" class="label">Gate projection → d_ff</text>
  <path class="flow" d="M290 330 V294"/>

  <rect class="module" x="645" y="330" width="330" height="58" rx="16"/>
  <text x="810" y="367" text-anchor="middle" class="label">Up projection → d_ff</text>
  <path class="flow" d="M810 330 V205 H573"/>

  <path class="flow" d="M550 478 H290 V389"/>
  <path class="flow" d="M550 478 H810 V389"/>
  <text x="550" y="462" text-anchor="middle" class="label">Input hidden states</text>
  <text x="550" y="500" text-anchor="middle" class="small">d_model = hidden_size · d_ff = intermediate_size</text>
</svg>
