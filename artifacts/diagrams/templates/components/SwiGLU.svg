<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" style="font-family:Arial, Helvetica, sans-serif">
  <circle data-anchor="origin" cx="0" cy="0" r="0" opacity="0"/>
  <circle data-anchor="input" cx="550" cy="540" r="0" opacity="0"/>
  <circle data-anchor="output" cx="550" cy="0" r="0" opacity="0"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .math { font-family: Arial, Helvetica, sans-serif; font-style: italic; fill:#111; }
      .title { font-size: 38px; font-weight: 700; }
      .label { font-size: 24px; }
      .small { font-size: 17px; }
      .box { stroke:#1a1a1a; stroke-width:2.2; }
      .gray { fill:#d8d8d8; }
      .pink { fill:#f7938f; }
      .wire { fill:none; stroke:#1a1a1a; stroke-width:2.1; marker-end:url(#arrow); stroke-linecap:round; stroke-linejoin:round; }
      .wire-noarrow { fill:none; stroke:#1a1a1a; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect x="2" y="2" width="1096" height="536" fill="#fafafa" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="9 8"/>

  <!-- title -->
  <text x="550" y="50" text-anchor="middle" class="sans title">SwiGLU FFN</text>

  <!-- output -->
  <text x="550" y="86" text-anchor="middle" class="sans label">Output</text>
  <path d="M550 132 L550 104" class="wire"/>

  <!-- down projection -->
  <rect x="415" y="133" width="270" height="68" rx="18" class="box gray"/>
  <text x="550" y="163" text-anchor="middle" class="sans label">Down Projection</text>
  <text x="550" y="188" text-anchor="middle" class="math small">→ d<tspan baseline-shift="sub" font-size="12">model</tspan></text>

  <!-- multiply -->
  <path d="M550 234 L550 202" class="wire"/>
  <circle cx="550" cy="252" r="24" class="box" fill="white"/>
  <text x="550" y="262" text-anchor="middle" class="sans" style="font-size:28px;">×</text>

  <!-- SiLU activation -->
  <rect x="210" y="292" width="170" height="64" rx="16" class="box pink"/>
  <text x="295" y="332" text-anchor="middle" class="sans label">SiLU</text>
  <path d="M295 292 L295 252 L525 252" class="wire"/>

  <!-- up projection wire to multiply -->
  <path d="M815 386 L815 252 L575 252" class="wire"/>

  <!-- gate projection -->
  <rect x="125" y="386" width="340" height="68" rx="18" class="box gray"/>
  <text x="295" y="416" text-anchor="middle" class="sans label">Gate Projection</text>
  <text x="295" y="441" text-anchor="middle" class="math small">→ d<tspan baseline-shift="sub" font-size="12">ff</tspan></text>
  <path d="M295 386 L295 357" class="wire"/>

  <!-- up projection -->
  <rect x="645" y="386" width="340" height="68" rx="18" class="box gray"/>
  <text x="815" y="416" text-anchor="middle" class="sans label">Up Projection</text>
  <text x="815" y="441" text-anchor="middle" class="math small">→ d<tspan baseline-shift="sub" font-size="12">ff</tspan></text>

  <!-- input X and split -->
  <text x="550" y="518" text-anchor="middle" class="sans" style="font-size:34px;">X</text>
  <path d="M550 490 L550 480" class="wire-noarrow"/>
  <path d="M550 480 L295 480 L295 455" class="wire"/>
  <path d="M550 480 L815 480 L815 455" class="wire"/>
</svg>
