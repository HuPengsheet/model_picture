<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" role="img" aria-label="Vertical multimodal input template" style="font-family:Arial, Helvetica, sans-serif">
  <!-- Local-coordinate contract: output is the fused hidden-state exit at upper center. -->
  <circle data-anchor="origin" cx="0" cy="0" r="0" opacity="0"/>
  <circle data-anchor="output" cx="410" cy="0" r="0" opacity="0"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8z" fill="#111"/>
    </marker>
  </defs>
  <style>
    .global-frame{fill:none;stroke:#111;stroke-width:3;stroke-dasharray:9 8}
    .outer{fill:#d4d4d4;stroke:#111;stroke-width:4}
    .module{fill:#fff;stroke:#111;stroke-width:4}
    .fusion{fill:#fb8f89;stroke:#111;stroke-width:4}
    .flow{fill:none;stroke:#111;stroke-width:3.2;stroke-linejoin:round;marker-end:url(#arrow)}
    .wire{fill:none;stroke:#111;stroke-width:3.2;stroke-linejoin:round}
    .title{font:700 25px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}
    .label{font:500 21px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}
    .detail{font:500 18px Arial,Helvetica,sans-serif;fill:#333;text-anchor:middle}
  </style>
  <rect width="820" height="660" fill="none"/>
  <rect class="global-frame" x="2" y="2" width="816" height="656" rx="28"/>
  <rect class="outer" x="24" y="24" width="772" height="612" rx="46"/>
  <text class="title" x="80" y="64" text-anchor="start">Multimodal input</text>

  <rect class="fusion" x="245" y="142" width="330" height="76" rx="16"/>
  <text data-slot="fusion_label" class="label" x="410" y="174">Multimodal embeddings</text>
  <text data-slot="dimension_label" class="detail" x="410" y="201">d_model = 5,120</text>
  <!-- The final arrowhead belongs to the receiving RMSNorm in the host diagram. -->
  <path class="wire" d="M410 142 V0"/>

  <rect class="module" x="67" y="380" width="190" height="58" rx="13"/>
  <rect class="module" x="315" y="380" width="190" height="58" rx="13"/>
  <rect class="module" x="563" y="380" width="190" height="58" rx="13"/>
  <text data-slot="text_encoder_label" class="label" x="162" y="417">Token embedding</text>
  <text data-slot="image_encoder_label" class="label" x="410" y="417">Vision encode</text>
  <text data-slot="video_encoder_label" class="label" x="658" y="417">Vision encode</text>

  <path class="wire" d="M162 380 V342 H410"/>
  <path class="wire" d="M410 380 V342"/>
  <path class="wire" d="M658 380 V342 H410"/>
  <path class="flow" d="M410 342 V220"/>

  <rect class="module" x="67" y="530" width="190" height="58" rx="13"/>
  <rect class="module" x="315" y="530" width="190" height="58" rx="13"/>
  <rect class="module" x="563" y="530" width="190" height="58" rx="13"/>
  <text data-slot="text_input_label" class="label" x="162" y="567">Text</text>
  <text data-slot="image_input_label" class="label" x="410" y="567">Image</text>
  <text data-slot="video_input_label" class="label" x="658" y="567">Video</text>

  <path class="flow" d="M162 530 V440"/>
  <path class="flow" d="M410 530 V440"/>
  <path class="flow" d="M658 530 V440"/>
</svg>
