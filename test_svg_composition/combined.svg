<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
  <title>Two-template SVG composition test</title>
  <desc>SwiGLU and Gated Attention independently placed by their input anchors.</desc>
  <rect width="1500" height="800" fill="#eaf1f8"/>
  <text x="750" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Anchor-based SVG composition</text>
  <path d="M80 650 H1420" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="95" y="635" font-family="Arial,sans-serif" font-size="16" fill="#666">shared input-anchor baseline</text>
  <svg x="85.0" y="380.0" width="550" height="270" viewBox="0 0 1100 540"><circle xmlns="http://www.w3.org/2000/svg" data-anchor="origin" cx="0" cy="0" r="0" opacity="0" />
  <circle xmlns="http://www.w3.org/2000/svg" data-anchor="input" cx="550" cy="540" r="0" opacity="0" />
  <circle xmlns="http://www.w3.org/2000/svg" data-anchor="output" cx="550" cy="0" r="0" opacity="0" />
  <title xmlns="http://www.w3.org/2000/svg" id="swiglu__title">SwiGLU feed-forward network template</title>
  <desc xmlns="http://www.w3.org/2000/svg" id="swiglu__desc">A reusable bottom-up SwiGLU diagram: the input branches into gate and up projections, the gate branch passes through SiLU, both branches multiply, then pass through the down projection.</desc>
  <style xmlns="http://www.w3.org/2000/svg">
    .panel{fill:#fff;stroke:#111;stroke-width:4;stroke-dasharray:7 8}
    .module{fill:#fff;stroke:#111;stroke-width:3}
    .activation{fill:#edf4ff;stroke:#111;stroke-width:3}
    .output{fill:#fff0d4;stroke:#111;stroke-width:3}
    .multiply{fill:#fff;stroke:#111;stroke-width:3}
    .flow{fill:none;stroke:#111;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}
    .title{font:700 30px Arial,Helvetica,sans-serif;fill:#111}
    .label{font:500 22px Arial,Helvetica,sans-serif;fill:#111}
    .small{font:500 19px Arial,Helvetica,sans-serif;fill:#555}
    .symbol{font:500 28px Arial,Helvetica,sans-serif;fill:#111}
  </style>
  <defs xmlns="http://www.w3.org/2000/svg">
    <marker id="swiglu__arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9z" fill="#111" />
    </marker>
  </defs>
  
  <rect xmlns="http://www.w3.org/2000/svg" width="1100" height="540" fill="none" />
  <rect xmlns="http://www.w3.org/2000/svg" class="panel" x="25" y="25" width="1050" height="490" rx="38" />
  <text xmlns="http://www.w3.org/2000/svg" x="550" y="68" text-anchor="middle" class="title">SwiGLU FFN</text>

  <rect xmlns="http://www.w3.org/2000/svg" class="output" x="415" y="92" width="270" height="58" rx="16" />
  <text xmlns="http://www.w3.org/2000/svg" x="550" y="129" text-anchor="middle" class="label">Down projection → d_model</text>
  <circle xmlns="http://www.w3.org/2000/svg" class="multiply" cx="550" cy="205" r="22" />
  <text xmlns="http://www.w3.org/2000/svg" x="550" y="215" text-anchor="middle" class="symbol">×</text>
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M550 183 V151" />

  <rect xmlns="http://www.w3.org/2000/svg" class="activation" x="205" y="235" width="170" height="58" rx="16" />
  <text xmlns="http://www.w3.org/2000/svg" x="290" y="272" text-anchor="middle" class="label">SiLU</text>
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M290 235 V205 H527" />

  <rect xmlns="http://www.w3.org/2000/svg" class="module" x="125" y="330" width="330" height="58" rx="16" />
  <text xmlns="http://www.w3.org/2000/svg" x="290" y="367" text-anchor="middle" class="label">Gate projection → d_ff</text>
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M290 330 V294" />

  <rect xmlns="http://www.w3.org/2000/svg" class="module" x="645" y="330" width="330" height="58" rx="16" />
  <text xmlns="http://www.w3.org/2000/svg" x="810" y="367" text-anchor="middle" class="label">Up projection → d_ff</text>
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M810 330 V205 H573" />

  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M550 478 H290 V389" />
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M550 478 H810 V389" />
  <text xmlns="http://www.w3.org/2000/svg" x="550" y="462" text-anchor="middle" class="label">Input hidden states</text>
  <text xmlns="http://www.w3.org/2000/svg" x="550" y="500" text-anchor="middle" class="small">d_model = hidden_size · d_ff = intermediate_size</text>
</svg>
  <svg x="675.0" y="325.0" width="450" height="325" viewBox="0 0 900 650"><circle xmlns="http://www.w3.org/2000/svg" data-anchor="origin" cx="0" cy="0" r="0" opacity="0" />
  <circle xmlns="http://www.w3.org/2000/svg" data-anchor="input" cx="450" cy="650" r="0" opacity="0" />
  <circle xmlns="http://www.w3.org/2000/svg" data-anchor="output" cx="450" cy="0" r="0" opacity="0" />
  <title xmlns="http://www.w3.org/2000/svg" id="gated_attention__title">Gated Attention</title>
  <desc xmlns="http://www.w3.org/2000/svg" id="gated_attention__desc">Gated attention with QK normalization, scaled dot-product attention, a sigmoid gate, element-wise multiplication and a final linear projection.</desc>
  <style xmlns="http://www.w3.org/2000/svg">.panel{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:6 7}.module{fill:#d9d9d9;stroke:#111;stroke-width:3}.norm{fill:#fff;stroke:#111;stroke-width:3}.attention{fill:#fffbdc;stroke:#111;stroke-width:3}.flow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.wire{fill:none;stroke:#111;stroke-width:3}.title{font:700 32px Arial,Helvetica,sans-serif;fill:#111}.label{font:500 22px Arial,Helvetica,sans-serif;fill:#111}.small{font:500 20px Arial,Helvetica,sans-serif;fill:#111}.symbol{font:500 30px Arial,Helvetica,sans-serif;fill:#111}</style>
  <defs xmlns="http://www.w3.org/2000/svg"><marker id="gated_attention__arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#111" /></marker></defs>
  
  <rect xmlns="http://www.w3.org/2000/svg" width="900" height="650" fill="none" />
  <text xmlns="http://www.w3.org/2000/svg" x="450" y="52" text-anchor="middle" class="title">Gated attention</text>
  <rect xmlns="http://www.w3.org/2000/svg" class="panel" x="45" y="82" width="810" height="520" rx="55" />
  <rect xmlns="http://www.w3.org/2000/svg" class="module" x="365" y="90" width="120" height="58" rx="18" /><text xmlns="http://www.w3.org/2000/svg" x="425" y="127" text-anchor="middle" class="label">Linear</text>
  <circle xmlns="http://www.w3.org/2000/svg" cx="425" cy="205" r="25" fill="#fff" stroke="#111" stroke-width="3" /><text xmlns="http://www.w3.org/2000/svg" x="425" y="215" text-anchor="middle" class="symbol">×</text>
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M425 180 V149" />
  <rect xmlns="http://www.w3.org/2000/svg" class="attention" x="105" y="260" width="520" height="62" rx="18" /><text xmlns="http://www.w3.org/2000/svg" x="365" y="299" text-anchor="middle" class="label">Scaled dot-product attention</text>
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M425 260 V230" />
  <circle xmlns="http://www.w3.org/2000/svg" cx="705" cy="300" r="24" fill="#fff" stroke="#111" stroke-width="3" /><text xmlns="http://www.w3.org/2000/svg" x="705" y="310" text-anchor="middle" class="symbol">σ</text>
  <text xmlns="http://www.w3.org/2000/svg" x="742" y="291" class="small">Sigmoid</text><text xmlns="http://www.w3.org/2000/svg" x="742" y="319" class="small">Gate</text>
  <path xmlns="http://www.w3.org/2000/svg" class="wire" d="M450 205 H705 V276" /><path xmlns="http://www.w3.org/2000/svg" class="flow" d="M681 300 H625" />
  <text xmlns="http://www.w3.org/2000/svg" x="145" y="365" text-anchor="middle" class="label">Q</text><text xmlns="http://www.w3.org/2000/svg" x="345" y="350" text-anchor="middle" class="label">K</text><text xmlns="http://www.w3.org/2000/svg" x="540" y="365" text-anchor="middle" class="label">V</text>
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M167 390 V322" />
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M312 390 V322" />
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M500 438 V322" />
  <text xmlns="http://www.w3.org/2000/svg" x="60" y="375" class="small">QKNorm</text>
  <rect xmlns="http://www.w3.org/2000/svg" class="norm" x="105" y="390" width="125" height="58" rx="16" /><text xmlns="http://www.w3.org/2000/svg" x="167" y="427" text-anchor="middle" class="small">RMSNorm</text>
  <rect xmlns="http://www.w3.org/2000/svg" class="norm" x="250" y="390" width="125" height="58" rx="16" /><text xmlns="http://www.w3.org/2000/svg" x="312" y="427" text-anchor="middle" class="small">RMSNorm</text>
  <rect xmlns="http://www.w3.org/2000/svg" class="module" x="105" y="500" width="125" height="58" rx="16" /><text xmlns="http://www.w3.org/2000/svg" x="167" y="537" text-anchor="middle" class="label">Linear</text>
  <rect xmlns="http://www.w3.org/2000/svg" class="module" x="250" y="500" width="125" height="58" rx="16" /><text xmlns="http://www.w3.org/2000/svg" x="312" y="537" text-anchor="middle" class="label">Linear</text>
  <rect xmlns="http://www.w3.org/2000/svg" class="module" x="438" y="500" width="125" height="58" rx="16" /><text xmlns="http://www.w3.org/2000/svg" x="500" y="537" text-anchor="middle" class="label">Linear</text>
  <rect xmlns="http://www.w3.org/2000/svg" class="module" x="642" y="500" width="125" height="58" rx="16" /><text xmlns="http://www.w3.org/2000/svg" x="704" y="537" text-anchor="middle" class="label">Linear</text>
  <path xmlns="http://www.w3.org/2000/svg" class="flow" d="M167 500 V448" /><path xmlns="http://www.w3.org/2000/svg" class="flow" d="M312 500 V448" /><path xmlns="http://www.w3.org/2000/svg" class="wire" d="M500 500 V438" /><path xmlns="http://www.w3.org/2000/svg" class="flow" d="M704 500 V324" />
</svg>
</svg>